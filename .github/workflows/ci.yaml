name: dcm-syndicate-engine-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,streaming,agents,api]"

      - name: Ruff lint
        run: ruff check dcm_engine tests

      - name: Mypy typecheck
        run: mypy dcm_engine

      - name: Pytest
        run: pytest -q --tb=short

  e2e:
    name: End-to-end: Redpanda -> producer -> consumer -> agent mesh
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[streaming,agents]"

      - name: Start Redpanda broker
        run: |
          docker run -d --name redpanda --net=host \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start --mode dev-container --smp 1 --memory 1G \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec redpanda rpk cluster health

      - name: Create topics
        run: |
          docker exec redpanda rpk topic create dcm.ioi.bids.v1 -p 3
          docker exec redpanda rpk topic create dcm.book.snapshots.v1 -p 3

      - name: Run end-to-end pipeline (IOIs -> book -> agent mesh -> recommendation)
        run: python scripts/e2e_kafka.py
        env:
          DCM_KAFKA_BOOTSTRAP: localhost:9092

      - name: Validate k8s manifest (client-side dry-run)
        run: kubectl create --dry-run=client -f deploy/deployment.yaml -o yaml > /dev/null

  container-build:
    name: Build & scan container image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
      security-events: write   # Required to upload Trivy SARIF to GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dcm-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------- Trivy vulnerability scanning ------------------------------
      # Fails the build on HIGH/CRITICAL vulns in OS packages + app deps.
      - name: Trivy - fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dcm-engine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy - SARIF upload to GitHub Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dcm-engine:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
