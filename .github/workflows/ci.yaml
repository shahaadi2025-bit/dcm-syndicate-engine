name: dcm-syndicate-engine-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,streaming,agents,api]"

      - name: Ruff lint
        run: ruff check dcm_engine tests

      - name: Mypy typecheck
        run: mypy dcm_engine

      - name: Pytest
        run: pytest -q --tb=short

  container-build:
    name: Build & scan container image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
      security-events: write   # Required to upload Trivy SARIF to GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dcm-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------- Trivy vulnerability scanning ------------------------------
      # Fails the build on HIGH/CRITICAL vulns in OS packages + app deps.
      - name: Trivy - fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: dcm-engine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy - SARIF upload to GitHub Security tab
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: dcm-engine:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
