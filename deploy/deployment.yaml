apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcm-book-builder
  labels:
    app.kubernetes.io/name: dcm-book-builder
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: dcm-syndicate-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dcm-book-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcm-book-builder
        app.kubernetes.io/component: streaming
      annotations:
        # Force rollout on config change (hash injected below by kustomize/helm in prod).
        dcm.engine/config-checksum: "manual"
    spec:
      # -------- Security context: hardened pod -------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: dcm-engine
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dcm-book-builder
      containers:
        - name: book-builder
          image: ghcr.io/your-org/dcm-book-builder:1.0.0   # pinned digest in prod
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "dcm_engine.pipeline.consumer"]
          ports:
            - name: http-metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: DCM_KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: dcm-engine-config
                  key: kafka_bootstrap
            - name: DCM_CONSUMER_MAX_MESSAGES
              value: ""
            - name: DCM_LLM_PROVIDER
              value: "rule"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          # -------- Container hardening ---------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # -------- Probes: liveness != readiness -----------------------
          livenessProbe:
            tcpSocket:
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Drain consumer group gracefully before SIGKILL.
                command: ["sleep", "10"]
      terminationGracePeriodSeconds: 45
      volumes:
        - name: tmp
          emptyDir: {}
---
# NOTE: The LangGraph agent mesh currently runs IN-PROCESS inside the
# FastAPI bridge (dcm_engine.bridge.engine.LiveBookEngine) with a 30s
# recommendation TTL, not as a separate Deployment. A standalone
# Kafka-triggered mesh service would belong here once one exists.
# ---------------- NetworkPolicy: default-deny east-west ----------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dcm-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dcm-syndicate-engine
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    # Allow DNS + Kafka only.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
      ports:
        - protocol: TCP
          port: 9092
